<tr id="contact-{{ contact.id }}" class="row-editing">
  <td>
    <input type="text" name="name" value="{{ contact.name }}" required form="edit-form-{{ contact.id }}" class="form-input-inline" placeholder="Nama">
  </td>
  <td>
    <input type="email" name="email" value="{{ contact.email }}" required form="edit-form-{{ contact.id }}" class="form-input-inline" placeholder="Email">
  </td>
  <td>
    <input type="text" name="phone" value="{{ contact.phone }}" form="edit-form-{{ contact.id }}" class="form-input-inline" placeholder="Nomor Telepon">
  </td>
  <td style="text-align: right; white-space: nowrap;">
    <form id="edit-form-{{ contact.id }}"
          hx-put="{% url 'contacts:contact_update' contact.id %}"
          hx-target="#contact-{{ contact.id }}"
          hx-swap="outerHTML"
          style="display: inline;">
      <button type="submit" class="btn-action-save">Simpan</button>
    </form>
    <button type="button"
            class="btn-action-cancel"
            hx-get="{% url 'contacts:contact_row' contact.id %}"
            hx-target="#contact-{{ contact.id }}"
            hx-swap="outerHTML">
      Batal
    </button>
  </td>
</tr>
