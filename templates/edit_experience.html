{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Experience - {{ name }}{% endblock %}

{% block meta %}
    <style>
        .form-section {
            width: 100%;
            padding: 3.5rem 0 5rem;
        }
        .form-card {
            background-color: #ffffff;
            border: 1.5px solid #f4d3db;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(229, 77, 109, 0.05);
        }
        .form-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2rem;
            font-weight: 700;
            color: #2b181e;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .form-table {
            width: 100%;
            margin-bottom: 1.5rem;
        }
        .form-table th, .form-table td {
            padding: 0.6rem 0.4rem;
            vertical-align: middle;
        }
        .form-table th {
            text-align: left;
            color: #2b181e;
            font-weight: 600;
            width: 30%;
        }
        .form-table input[type="text"], 
        .form-table input[type="url"],
        .form-table textarea, 
        .form-table select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1.5px solid #f4d3db;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }
        .form-table input:focus, 
        .form-table textarea:focus, 
        .form-table select:focus {
            border-color: #e54d6d;
        }
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        .btn-submit {
            background-color: #e54d6d;
            color: #ffffff;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(229, 77, 109, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(229, 77, 109, 0.35);
        }
        .btn-cancel {
            background-color: #fdf0f3;
            color: #b82346;
            border: 1.5px solid #f4d3db;
            padding: 0.7rem 1.8rem;
            border-radius: 9999px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
    </style>
{% endblock meta %}

{% block content %}
    <section class="form-section">
        <div class="container">
            <div class="form-card">
                <h1 class="form-title">Edit Experience</h1>

                <form method="POST">
                    {% csrf_token %}
                    <table class="form-table">
                        {{ form.as_table }}
                    </table>
                    
                    <div class="form-actions">
                        <a href="{% url 'main:show_experience' %}" class="btn-cancel">Batal</a>
                        <input type="submit" value="Simpan Perubahan" class="btn-submit">
                    </div>
                </form>
            </div>
        </div>
    </section>
{% endblock content %}
